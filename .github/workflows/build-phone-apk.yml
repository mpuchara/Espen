name: Ala phone APK
on:
  push:
    branches:
      - feat/ala-phone-emotions-speech-panel
    paths:
      - "android/**"
      - ".github/workflows/build-phone-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ala-Panel.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ala-Panel-APK
          path: Ala-Panel.apk
          if-no-files-found: error
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=ala-panel-v0.1.0
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Ala-Panel.apk --clobber
          else
            gh release create "$tag" Ala-Panel.apk \
              --target "$GITHUB_SHA" \
              --title "Pilot Ali na telefon 0.1.0" \
              --notes "APK na Android 8.0+. Sterowanie 16 emocjami i tekstem Ali przez lokalne Wi-Fi. Wymaga firmware z panelowym API z PR #24 i tego samego Wi-Fi. Wydanie testowe — APK podpisana kluczem debug." \
              --prerelease
          fi
