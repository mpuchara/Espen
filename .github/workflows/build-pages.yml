name: Espen firmware and installer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: espen-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Xiaozhi port
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          bash scripts/build.sh
      # Serve the already-verified Ala Pilot build in an isolated /pilot/
      # subdirectory. The root installer continues to serve main firmware.
      - name: Stage optional Ala Pilot installer
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/mpuchara/Espen/releases/download/ala-pilot-v0.2.14-test1"
          mkdir -p dist/pilot
          for file in espen-app.bin espen-assets.bin espen-update.sha256; do
            curl --fail --location --retry 4 --retry-all-errors \
              --output "dist/pilot/$file" "$base/$file"
            test -s "dist/pilot/$file"
          done
          (cd dist/pilot && sha256sum --check espen-update.sha256)
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: espen-guition-p4
          path: |
            dist/espen.bin
            dist/espen.bin.sha256
            dist/espen-app.bin
            dist/espen-assets.bin
            dist/espen-update.sha256
          if-no-files-found: error
      - name: Upload debug symbols and effective configuration
        uses: actions/upload-artifact@v4
        with:
          name: espen-debug-symbols
          path: |
            upstream/build/xiaozhi.elf
            upstream/build/xiaozhi.map
            upstream/sdkconfig
            upstream/dependencies.lock
          if-no-files-found: error
      - name: Upload Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
