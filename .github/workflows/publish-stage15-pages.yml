name: Publish isolated Ala 0.2.23 preview
on:
  push:
    branches: [codex/ala-stage15-pages]
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ala-stage15-pages-preview
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 44914261168
          repository: mpuchara/Espen
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: ala-stage15-full-installer
          run-id: 44914931588
          repository: mpuchara/Espen
          github-token: ${{ github.token }}
          path: candidate
      - name: Add the verified preview and preserve the deployed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          tar -xf previous/artifact.tar -C dist
          test ! -e dist/stage15/0.2.23
          for path in index.html espen.bin.sha256 manifest-full.json \
            ala-stage{9,10}/{index.html,manifest.json} \
            stage{11..14}/{index.html,espen.bin.sha256,manifest-full.json} stage15/{index.html,espen.bin.sha256,manifest.json}; do
            curl --fail --silent --show-error "https://mpuchara.github.io/Espen/$path" -o live-check
            cmp "dist/$path" live-check
          done
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > baseline.sha256
          cp -a candidate dist/stage15/0.2.23
          (cd dist && sha256sum --quiet --check ../baseline.sha256)
          (cd dist/stage15/0.2.23 && sha256sum --check espen.bin.sha256)
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dist/stage15/0.2.23/index.html")
          html=p.read_text(encoding="utf-8")
          anchor="<h1>Ala 0.2.23</h1>"
          assert html.count(anchor)==1
          status=("<p>Wersja do testów aparatu i odtwarzania. "
                  "Magiczna Opowieść pozostaje niedostępna na oficjalnym serwerze Xiaozhi, "
                  "który odrzuca prompty tekstowe.</p>")
          p.write_text(html.replace(anchor,anchor+status,1),encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: ala-stage15-preview
      url: ${{ steps.deploy.outputs.page_url }}stage15/0.2.23/
    steps:
      - name: Wait for the uploaded Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and (.expired | not))] | length')
            if [[ "$count" == 1 ]]; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
