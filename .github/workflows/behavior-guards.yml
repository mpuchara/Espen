name: Ala behavior contracts
on:
  pull_request:
    branches: [main, feature/ala-central-behavior-engine-stage2, feature/ala-living-robot-engine-stage3, feature/ala-conversation-intelligence-stage4]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify phone, TV, standby and full-flash contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_behavior_contracts.py
          python3 tests/test_ala_social_contracts.py
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_ala_social_intelligence.cc -o /tmp/ala-social-test
          /tmp/ala-social-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_ala_behavior_engine.cc -o /tmp/ala-behavior-engine-test
          /tmp/ala-behavior-engine-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_living_robot_engine.cc -o /tmp/ala-living-robot-test
          /tmp/ala-living-robot-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_ala_conversation_manager.cc -o /tmp/ala-stage4-turn-test
          /tmp/ala-stage4-turn-test
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_behavior_foundation.cc -o /tmp/ala-behavior-foundation-test
          /tmp/ala-behavior-foundation-test
