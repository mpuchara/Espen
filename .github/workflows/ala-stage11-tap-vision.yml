name: Ala Stage 11 - tap camera vision and full firmware
on:
  push:
    branches: [feature/ala-stage11-tap-vision]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vision-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Stage 11 camera, games, voice, and privacy contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_phone.py
          python3 tests/test_ala_stage11_vision_contracts.py
          python3 tests/test_ala_play_games_contracts.py
          python3 tests/test_photo_chat_integration.py
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_vision_gate.cc -o /tmp/ala-vision-gate
          /tmp/ala-vision-gate
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_ala_play_games.cc -o /tmp/ala-stage11-story
          /tmp/ala-stage11-story
  esp32-p4-full-image:
    needs: vision-host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Compile complete 0.2.18 image and verify offsets
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          bash scripts/build.sh
          (cd dist && sha256sum --check espen.bin.sha256 && sha256sum --check espen-update.sha256)
          python3 - <<'PY'
          from pathlib import Path
          full=Path("dist/espen.bin").read_bytes()
          app=Path("dist/espen-app.bin").read_bytes()
          assert 0x800000<len(full)<=16*1024*1024
          assert full[0x2000]==0xE9, "bootloader missing"
          assert full[0x20000]==0xE9, "application missing"
          assert full[0x20000:0x20000+len(app)]==app
          print("Ala 0.2.18 Stage 11: full ESP32-P4 image OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ala-stage11-camera-vision-full-flash
          path: |
            dist/espen.bin
            dist/espen.bin.sha256
            dist/espen-app.bin
            dist/espen-assets.bin
            dist/espen-update.sha256
          if-no-files-found: error
