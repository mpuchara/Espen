name: Build Garett Espen Android APK

on:
  push:
    paths:
      - 'android/garett-espen/**'
      - '.github/workflows/build-garett-espen.yml'
  pull_request:
    paths:
      - 'android/garett-espen/**'
      - '.github/workflows/build-garett-espen.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android/garett-espen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android 8.1 minimal face-test APK
        run: gradle --no-daemon --stacktrace :lite:assembleDebug
      - name: Upload independent face-test APK
        uses: actions/upload-artifact@v4
        with:
          name: garett-espen-android81-face-test-v1
          path: android/garett-espen/lite/build/outputs/apk/debug/lite-debug.apk
          if-no-files-found: error
      - name: Test Opus codec compatibility on JVM
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build Android 8.1 full compatibility APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: garett-espen-android81-full-v1
          path: android/garett-espen/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
