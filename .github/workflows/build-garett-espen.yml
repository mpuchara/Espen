name: Build Garett Espen Android APK

on:
  push:
    paths:
      - 'android/garett-espen/**'
      - '.github/workflows/build-garett-espen.yml'
  pull_request:
    paths:
      - 'android/garett-espen/**'
      - '.github/workflows/build-garett-espen.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android/garett-espen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: garett-espen-debug-apk
          path: android/garett-espen/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
