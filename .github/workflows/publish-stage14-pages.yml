name: Publish Ala Stage 14 animated-face Magic Story (Pages)
on:
  push:
    branches: [feature/ala-stage14-story-face-animations]
    paths:
      - .github/workflows/publish-stage14-pages.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ala-stage14-pages-preview
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/feature/ala-stage14-story-face-animations'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ala-stage14-preview
      url: ${{ steps.deploy.outputs.page_url }}stage14/
    steps:
      - name: Checkout stable v0.2.17 web installer
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Checkout Stage 11 v0.2.18
        uses: actions/checkout@v4
        with:
          ref: feature/ala-stage11-tap-vision
          path: stage11src
      - name: Checkout Stage 12 v0.2.19
        uses: actions/checkout@v4
        with:
          ref: feature/ala-stage12-ai-magic-story
          path: stage12src
      - name: Checkout Stage 13 v0.2.20
        uses: actions/checkout@v4
        with:
          ref: feature/ala-stage13-voice-first-single-choice
          path: stage13src
      - name: Checkout Stage 14 v0.2.21
        uses: actions/checkout@v4
        with:
          ref: feature/ala-stage14-story-face-animations
          path: stage14src
      - name: Download verified stable full P4 firmware
        uses: actions/download-artifact@v4
        with:
          name: espen-guition-p4
          run-id: 44833709126
          repository: mpuchara/Espen
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Download verified Stage 11 full P4 firmware
        uses: actions/download-artifact@v4
        with:
          name: ala-stage11-camera-vision-full-flash
          run-id: 44840342163
          repository: mpuchara/Espen
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/stage11
      - name: Download verified Stage 12 full P4 firmware
        uses: actions/download-artifact@v4
        with:
          name: ala-stage12-magic-story-full-flash
          run-id: 44844038865
          repository: mpuchara/Espen
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/stage12
      - name: Download Stage 13 full P4 firmware from successful build
        uses: actions/download-artifact@v4
        with:
          name: espen-guition-p4
          run-id: 44846534671
          repository: mpuchara/Espen
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/stage13
      - name: Check Stage 14 CI verified the complete ESP32-P4 build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 125); do
            result="$(gh api repos/mpuchara/Espen/actions/runs/44903966333 --jq '.status + ":" + (.conclusion // "pending")')"
            if [[ "$result" == "completed:success" ]]; then
              echo "Stage 14 full image passed all tests."
              exit 0
            fi
            if [[ "$result" == completed:* ]]; then
              echo "::error::Stage 14 CI ended as $result"
              exit 1
            fi
            sleep 8
          done
          echo "::error::Stage 14 CI not complete"
          exit 1
      - name: Download Stage 14 validated full P4 image
        uses: actions/download-artifact@v4
        with:
          name: ala-stage14-story-face-full-flash
          run-id: 44903966333
          repository: mpuchara/Espen
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/stage14
      - name: Assemble and verify all separate full-flash installers
        shell: bash
        run: |
          set -euo pipefail
          cp -a stable/web/. dist/
          cp -a stage11src/web/. dist/stage11/
          cp -a stage12src/web/. dist/stage12/
          cp -a stage13src/web/. dist/stage13/
          cp -a stage14src/web/. dist/stage14/
          for d in dist dist/stage11 dist/stage12 dist/stage13 dist/stage14; do
            mkdir -p "$d/pilot"
            for file in espen.bin espen.bin.sha256 espen-app.bin espen-assets.bin espen-update.sha256; do
              cp "$d/$file" "$d/pilot/$file"
              test -s "$d/pilot/$file"
            done
            (cd "$d" && sha256sum --check espen.bin.sha256 && sha256sum --check espen-update.sha256)
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          for directory,version in (
              ('dist','0.2.17'),('dist/stage11','0.2.18'),
              ('dist/stage12','0.2.19'),('dist/stage13','0.2.20'),
              ('dist/stage14','0.2.21')):
              d=Path(directory)
              m=json.loads((d/'manifest-full.json').read_text(encoding='utf-8'))
              assert m['version']==version,(directory,m['version'])
              assert m['builds'][0]['chipFamily']=='ESP32-P4'
              assert m['builds'][0]['parts']==[{'path':'espen.bin','offset':0}]
              image=(d/'espen.bin').read_bytes()
              app=(d/'espen-app.bin').read_bytes()
              assert 0x800000<len(image)<=16*1024*1024
              assert image[0x2000]==0xe9 and image[0x20000]==0xe9
              assert image[0x20000:0x20000+len(app)]==app
              index=(d/'index.html').read_text(encoding='utf-8')
              assert version in index
              assert 'id="full-installer"' in index
              assert 'manifest="manifest-full.json"' in index
              print(f'{directory}: OK verified complete flash v{version}')
          root=Path('dist/index.html')
          html=root.read_text(encoding='utf-8')
          anchor='<h1>Espen.</h1>'
          assert html.count(anchor)==1
          banner=(
              '<section style="border:2px solid #78e1cb;'
              'background:#102a32;padding:16px;margin:20px 0;border-radius:16px">'
              '<h2>✨ Ala 0.2.21 — Magiczna Opowieść z animowaną twarzą</h2>'
              '<p>Gdy Ala opowiada historię, pokazuje swoje oczy, emocje, '
              'poruszające się usta i magiczne gwiazdki. '
              'Mówi jedną propozycję i pyta, czy masz własny pomysł.</p>'
              '<a href="stage14/" style="font-size:1.2rem;font-weight:bold">'
              '🚀 Instaluj pełną Alę 0.2.21 — Stage 14</a>'
              '<p><a href="stage13/">Wersja 0.2.20</a> · '
              '<a href="stage12/">0.2.19</a> · '
              '<a href="stage11/">0.2.18</a></p>'
              '</section>')
          root.write_text(html.replace(anchor,anchor+banner,1),encoding='utf-8')
          stage=Path('dist/stage13/index.html')
          html=stage.read_text(encoding='utf-8')
          assert html.count(anchor)==1
          title=(
              '<p><strong>ALA STAGE 13 · 0.2.20 TESTOWA</strong></p>'
              '<p>Magiczna Opowieść od początku jest mówiona przez Alę. '
              'Witamy dziecko, wybieramy scenerię i słuchamy opowieści. '
              'Ala proponuje jeden dalszy krok, potem pyta, czy historia '
              'ma potoczyć się inaczej. Powiedz „tak” albo opowiedz jej '
              'swoją wersję — następny rozdział powstanie z tego pomysłu. '
              'Wymaga Wi-Fi i Xiaozhi. Zbudowano i sprawdzono automatycznie, '
              'bez testu na fizycznym urządzeniu.</p>')
          stage.write_text(html.replace(anchor,anchor+title,1),encoding='utf-8')
          stage14=Path('dist/stage14/index.html')
          html=stage14.read_text(encoding='utf-8')
          assert html.count(anchor)==1
          title14=(
              '<p><strong>ALA STAGE 14 · 0.2.21 · TESTOWA</strong></p>'
              '<p><b>Teraz Ala pokazuje animowaną twarz podczas bajki!</b> '
              'Ruszają się usta podczas mówienia, oczy mrugają i pokazują emocje, '
              'a wokół twarzy pojawiają się delikatne błyski. '
              'Na górze widzisz status, na dole wybór „Pomysł Ali” lub „Mój pomysł”. '
              'Historia pozostaje opowiadana głosem; wymagane jest Wi-Fi i Xiaozhi. '
              'Pełna instalacja może usunąć konfigurację Wi-Fi i parowanie. '
              'Automatyczne testy P4 przeszły; nadal potrzebny jest test '
              'na fizycznej Ali.</p>')
          stage14.write_text(html.replace(anchor,anchor+title14,1),encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - name: Upload full installers with isolated versions
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
        id: deploy
