name: Ala Stage 14 - animated face in Magic Story (full flash)
on:
  push:
    branches: [feature/ala-stage14-story-face-animations]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  story-face-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify visible speaking face and previous story/vision contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_phone.py scripts/prepare.py
          python3 tests/test_ala_stage14_story_face_contracts.py
          python3 tests/test_ala_stage13_voice_first_contracts.py
          python3 tests/test_ala_stage12_magic_contracts.py
          python3 tests/test_ala_stage11_vision_contracts.py
          python3 tests/test_ala_play_games_contracts.py
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_ala_magic_story.cc -o /tmp/ala-stage14-story
          /tmp/ala-stage14-story
          c++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_ala_play_games.cc -o /tmp/ala-stage14-games
          /tmp/ala-stage14-games
  p4-complete-firmware:
    needs: story-face-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Compile full-flash Ala 0.2.21 and verify layout
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          bash scripts/build.sh
          (cd dist && sha256sum --check espen.bin.sha256 && sha256sum --check espen-update.sha256)
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=Path('dist')
          full=(d/'espen.bin').read_bytes()
          app=(d/'espen-app.bin').read_bytes()
          m=json.loads((d/'manifest-full.json').read_text(encoding='utf-8'))
          assert m['version']=='0.2.21'
          assert m['builds'][0]['chipFamily']=='ESP32-P4'
          assert m['builds'][0]['parts']==[{'path':'espen.bin','offset':0}]
          assert 0x800000<len(full)<=16*1024*1024
          assert full[0x2000]==0xe9 and full[0x20000]==0xe9
          assert full[0x20000:0x20000+len(app)]==app
          print("Ala 0.2.21 animated-face full image verified")
          PY
      - name: Upload full image (never delta)
        uses: actions/upload-artifact@v4
        with:
          name: ala-stage14-story-face-full-flash
          path: |
            dist/espen.bin
            dist/espen.bin.sha256
            dist/espen-app.bin
            dist/espen-assets.bin
            dist/espen-update.sha256
          if-no-files-found: error
