name: Espen Mobile APK

on:
  push:
    branches:
      - main
      - feature/espen-mobile-android-mvp-20261117
    paths:
      - 'android/espen-mobile/**'
      - '.github/workflows/android-mobile.yml'
  pull_request:
    paths:
      - 'android/espen-mobile/**'
      - '.github/workflows/android-mobile.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle -p android/espen-mobile --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: espen-mobile-debug-apk
          path: android/espen-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
