plugins { id 'com.android.application' }

android {
    namespace 'pl.espen.garett'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.espen.ala.phone'
        minSdk 26                 // Android 8.0, compatible with Garett's 8.1
        targetSdk 27              // Do not opt into modern Android package behavior
        versionCode 1
        versionName '0.1.0-phone'
    }

    // Keep an APK installable on older phones and watches; this is a separate phone app.
    // correctly. Produce a traditional JAR-signed v1 APK (Android 8.1 accepts it).
    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = false
            enableV3Signing = false
            enableV4Signing = false
        }
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    testImplementation 'junit:junit:4.13.2'
}
